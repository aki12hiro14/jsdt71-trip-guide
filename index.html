<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出張のしおり</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap');

  :root{
    --ink:#0d2438;        /* 夜の港の紺 */
    --ink-2:#16344e;
    --paper:#f4efe4;      /* 生成りの紙 */
    --paper-2:#ece5d4;
    --gold:#b08949;       /* 真鍮の金 */
    --gold-l:#cfa765;
    --sea:#2f6f86;        /* 港の青緑 */
    --line:rgba(176,137,73,.35);
    --shadow:rgba(13,36,56,.12);
  }

  *{box-sizing:border-box;margin:0;padding:0}

  body{
    font-family:'Zen Kaku Gothic New',sans-serif;
    background:var(--ink);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    line-height:1.8;
  }

  .book{
    max-width:880px;
    margin:0 auto;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 20% 10%, rgba(176,137,73,.05), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(47,111,134,.05), transparent 45%);
  }

  /* ===== 表紙 ===== */
  .cover{
    position:relative;
    background:
      linear-gradient(165deg, var(--ink) 0%, var(--ink-2) 55%, #0a1c2b 100%);
    color:var(--paper);
    padding:56px 48px 64px;
    overflow:hidden;
  }
  .cover::before{
    content:"";
    position:absolute;inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(244,239,228,.04) 0 1px, transparent 1px 64px);
    opacity:.6;
  }
  .cover .wave{
    position:absolute;
    right:-60px;bottom:-40px;
    width:340px;height:340px;
    border:1px solid rgba(207,167,101,.25);
    border-radius:50%;
  }
  .cover .wave::after,
  .cover .wave::before{
    content:"";position:absolute;border-radius:50%;
    border:1px solid rgba(207,167,101,.18);
  }
  .cover .wave::before{inset:34px}
  .cover .wave::after{inset:74px;border-color:rgba(47,111,134,.35)}

  .eyebrow{
    position:relative;z-index:2;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    letter-spacing:.18em;
    font-size:18px;
    color:var(--gold-l);
    margin-bottom:22px;
  }
  .cover h1{
    position:relative;z-index:2;
    font-family:'Shippori Mincho',serif;
    font-weight:800;
    font-size:38px;
    line-height:1.35;
    letter-spacing:.02em;
    margin-bottom:6px;
  }
  .cover h1 .em{color:var(--gold-l)}
  .cover .sub{
    position:relative;z-index:2;
    font-family:'Shippori Mincho',serif;
    font-size:17px;
    letter-spacing:.3em;
    color:rgba(244,239,228,.78);
    margin-top:14px;
  }
  .cover .meta{
    position:relative;z-index:2;
    margin-top:38px;
    display:flex;gap:28px;flex-wrap:wrap;
    border-top:1px solid rgba(207,167,101,.3);
    padding-top:22px;
  }
  .cover .meta div span{
    display:block;
    font-family:'Cormorant Garamond',serif;
    font-size:12px;letter-spacing:.2em;
    color:var(--gold-l);
    text-transform:uppercase;
    margin-bottom:3px;
  }
  .cover .meta div strong{
    font-family:'Shippori Mincho',serif;
    font-weight:600;font-size:18px;
    color:var(--paper);
  }

  /* ===== 日付の章扉 ===== */
  .day-head{
    display:flex;align-items:baseline;gap:18px;
    padding:36px 48px 8px;
    border-bottom:2px solid var(--gold);
    margin:0 0 4px;
  }
  .day-head .num{
    font-family:'Cormorant Garamond',serif;
    font-size:72px;font-weight:600;
    color:var(--gold);
    line-height:.8;
  }
  .day-head .dh-txt h2{
    font-family:'Shippori Mincho',serif;
    font-weight:700;font-size:23px;
    color:var(--ink);
  }
  .day-head .dh-txt p{
    font-size:13px;letter-spacing:.16em;
    color:var(--sea);
    font-weight:500;
    margin-top:2px;
  }

  section.day{padding:0 48px 20px}



  /* ===== DAY 1 / DAY 2 カラーテーマ ===== */
  .day-chapter{
    --day-accent:var(--gold);
    --day-deep:var(--ink);
    --day-mid:var(--ink-2);
    --day-soft:rgba(176,137,73,.10);
    --day-line:rgba(176,137,73,.32);
    position:relative;
    margin-top:18px;
    padding-bottom:10px;
    border-radius:6px;
  }
  .day-chapter:first-of-type{margin-top:0}
  .day-chapter.day-1{
    --day-accent:#3f8399;      /* DAY 1：スマホでも見やすい明るめの青緑 */
    --day-deep:#12384d;
    --day-mid:#1e5b70;
    --day-soft:rgba(124,197,218,.24);
    --day-line:rgba(63,131,153,.34);
    background:linear-gradient(180deg, rgba(154,215,232,.26) 0%, rgba(154,215,232,.11) 100%);
    box-shadow:inset 0 0 0 1px rgba(63,131,153,.12);
  }
  .day-chapter.day-2{
    --day-accent:#b2667f;      /* DAY 2：スマホでも見やすい明るめのワイン色 */
    --day-deep:#4b2634;
    --day-mid:#754255;
    --day-soft:rgba(231,184,199,.26);
    --day-line:rgba(178,102,127,.36);
    background:linear-gradient(180deg, rgba(239,199,211,.28) 0%, rgba(239,199,211,.11) 100%);
    box-shadow:inset 0 0 0 1px rgba(178,102,127,.12);
  }
  .day-chapter .day-head{
    border-bottom-color:var(--day-accent);
    background:linear-gradient(90deg,var(--day-soft),transparent 78%);
  }
  .day-chapter .day-head .num,
  .day-chapter .day-head .dh-txt p,
  .day-chapter .stop .time,
  .day-chapter .stop .route,
  .day-chapter .note .mk,
  .day-chapter .transit-step .ts-time{
    color:var(--day-accent);
  }
  .day-chapter section.day{
    background:linear-gradient(180deg,var(--day-soft),transparent 180px);
  }
  .day-chapter .timeline::before{
    background:var(--day-line);
  }
  .day-chapter .stop::before{
    border-color:var(--day-accent);
  }
  .day-chapter .stop.key::before{
    background:var(--day-accent);
    box-shadow:0 0 0 4px var(--day-soft);
  }
  .day-chapter .talk,
  .day-chapter .evening{
    background:linear-gradient(160deg,var(--day-deep),var(--day-mid));
  }
  .day-chapter .talk::before{
    background:linear-gradient(var(--gold-l),var(--day-accent));
  }
  .day-chapter .note{
    background:var(--day-soft);
    border-left-color:var(--day-accent);
  }
  .day-chapter .transit-drawer{
    border-color:var(--day-line);
    background:var(--day-soft);
  }
  .day-chapter .transit-drawer summary::after,
  .day-chapter .tt-btn{
    background:var(--day-accent);
    color:#fff;
  }
  .day-chapter .transit-drawer[open] summary{
    border-bottom-color:var(--day-line);
    background:var(--day-soft);
  }
  .day-chapter .transit-step{
    border-bottom-color:var(--day-line);
  }
  .day-chapter .tt-btn:hover{
    background:var(--day-accent);
    filter:brightness(.92);
  }

  /* ===== タイムライン ===== */
  .timeline{
    position:relative;
    margin:28px 0 8px;
    padding-left:96px;
  }
  .timeline::before{
    content:"";position:absolute;
    left:78px;top:8px;bottom:8px;
    width:1px;background:var(--line);
  }
  .stop{
    position:relative;
    margin-bottom:26px;
  }
  .stop .time{
    position:absolute;
    left:-96px;width:66px;text-align:right;
    font-family:'Cormorant Garamond',serif;
    font-weight:600;font-size:17px;
    color:var(--sea);
    padding-top:1px;
  }
  .stop .time small{
    display:block;font-family:'Zen Kaku Gothic New';
    font-size:10px;letter-spacing:.1em;color:rgba(13,36,56,.45)
  }
  .stop::before{
    content:"";position:absolute;
    left:-22px;top:7px;
    width:9px;height:9px;border-radius:50%;
    background:var(--paper);
    border:2px solid var(--gold);
  }
  .stop.key::before{
    background:var(--gold);
    box-shadow:0 0 0 4px rgba(176,137,73,.18);
  }
  .stop h3{
    font-family:'Shippori Mincho',serif;
    font-weight:600;font-size:16px;
    color:var(--ink);
    margin-bottom:3px;
  }
  .stop p{font-size:13.5px;color:rgba(13,36,56,.78)}
  .stop .route{
    font-size:12.5px;color:var(--sea);
    margin-top:3px;letter-spacing:.02em;
  }
  .stop .route::before{content:"→ ";color:var(--gold)}

  /* 見出し横のバッジ（SKYMARK 等） */
  .badge{font-size:11px;color:var(--gold);letter-spacing:.1em;font-weight:500}

  /* ===== 発表カード（主役） ===== */
  .talk{
    background:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 100%);
    color:var(--paper);
    border-radius:3px;
    padding:22px 24px;
    margin:6px 0 8px;
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 26px var(--shadow);
  }
  .talk::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(var(--gold-l),var(--gold));
  }
  .talk .tag{
    font-family:'Cormorant Garamond',serif;
    font-style:italic;font-size:14px;letter-spacing:.12em;
    color:var(--gold-l);
    margin-bottom:6px;
  }
  .talk h3{
    font-family:'Shippori Mincho',serif;
    font-weight:700;font-size:22px;
    margin-bottom:14px;color:var(--paper)
  }
  .talk .grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px 18px;
    border-top:1px solid rgba(207,167,101,.25);
    padding-top:14px;
  }
  .talk .grid div span{
    display:block;font-size:10.5px;letter-spacing:.16em;
    color:var(--gold-l);text-transform:uppercase;
    font-family:'Cormorant Garamond',serif;margin-bottom:2px;
  }
  .talk .grid div strong{
    font-family:'Shippori Mincho',serif;
    font-weight:600;font-size:15px;color:var(--paper);
  }
  .talk .grid div.wide{grid-column:1/-1}

  /* ===== メモ・注意 ===== */
  .note{
    display:flex;gap:12px;
    background:var(--paper-2);
    border-left:3px solid var(--sea);
    padding:12px 16px;
    margin:6px 0 4px 96px;
    font-size:12.5px;
    color:rgba(13,36,56,.82);
    border-radius:2px;
  }
  .note .mk{
    font-family:'Shippori Mincho',serif;
    font-weight:700;color:var(--sea);
    flex-shrink:0;
  }

  /* ===== 夜の理想プラン帯 ===== */
  .evening{
    margin:18px 48px 0;
    background:linear-gradient(160deg,#13283c,#0a1c2b);
    color:var(--paper);
    padding:24px 28px;border-radius:4px;
    box-shadow:0 8px 26px var(--shadow);
  }
  .evening h4{
    font-family:'Shippori Mincho',serif;
    font-size:16px;font-weight:600;
    color:var(--gold-l);margin-bottom:14px;
    display:flex;align-items:center;gap:10px;
  }
  .evening h4::before{content:"";width:22px;height:1px;background:var(--gold)}
  .evening .row{
    display:flex;gap:16px;align-items:baseline;
    padding:7px 0;
    border-bottom:1px dotted rgba(207,167,101,.22);
    font-size:13.5px;
  }
  .evening .row:last-child{border-bottom:none}
  .evening .row .t{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;font-size:15px;color:var(--gold-l);
    min-width:96px;
  }

  /* ===== フッター ===== */
  .foot{
    background:var(--ink);color:rgba(244,239,228,.6);
    text-align:center;padding:24px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;letter-spacing:.14em;font-size:13px;
  }
  .foot span{color:var(--gold-l)}

  @media(max-width:600px){
    .cover{padding:40px 24px 48px}
    .cover h1{font-size:28px}
    .day-head{padding:28px 22px 8px}
    section.day{padding:0 22px 16px}
    .timeline{padding-left:74px}
    .timeline::before{left:58px}
    .stop .time{left:-74px;width:50px;font-size:15px}
    .stop::before{left:-19px}
    .note{margin-left:74px}
    .evening{margin:18px 22px 0}
    .talk .grid{grid-template-columns:repeat(2,1fr)}
  }


  /* ===== 電車・乗換のひきだし ===== */
  .transit-drawer{
    margin-top:9px;
    scroll-margin-top:12px;
    border:1px solid var(--line);
    border-radius:6px;
    background:rgba(236,229,212,.72);
    overflow:hidden;
  }
  .transit-drawer summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:10px 13px;
    color:var(--ink);
    font-size:12.5px;
    font-weight:700;
    -webkit-tap-highlight-color:transparent;
  }
  .transit-drawer summary::-webkit-details-marker{display:none}
  .transit-drawer summary::after{
    content:"＋";
    flex-shrink:0;
    width:22px;height:22px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--gold);
    color:var(--paper);
    font-size:15px;
    line-height:1;
    transition:transform .2s ease;
  }
  .transit-drawer[open] summary::after{
    content:"−";
    transform:rotate(180deg);
  }
  .transit-drawer[open] summary{
    border-bottom:1px solid var(--line);
    background:rgba(176,137,73,.08);
  }
  .transit-body{
    padding:12px 13px 13px;
    font-size:12.5px;
    color:rgba(13,36,56,.82);
  }
  .transit-body p{margin-bottom:8px}
  .transit-body p:last-child{margin-bottom:0}
  .transit-step{
    display:grid;
    grid-template-columns:58px 1fr;
    gap:10px;
    padding:7px 0;
    border-bottom:1px dotted var(--line);
  }
  .transit-step:last-of-type{border-bottom:none}
  .transit-step .ts-time{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;
    font-size:15px;
    color:var(--sea);
    white-space:nowrap;
  }
  .transit-step strong{color:var(--ink)}
  .transit-body .tt-btn{margin-top:10px}

  @media print{
    body{background:#fff}
    .talk,.evening{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .cover{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .day-head{break-before:page}
  }

  /* ===== 持ち物チェックリスト ===== */
  section.checklist{padding:0 48px 28px}
  .cl-progress{
    display:flex;align-items:center;gap:14px;
    margin:24px 0 22px;
  }
  .cl-progress .bar{
    flex:1;height:6px;border-radius:3px;
    background:var(--paper-2);overflow:hidden;
  }
  .cl-progress .bar i{
    display:block;height:100%;width:0;
    background:linear-gradient(90deg,var(--gold-l),var(--gold));
    transition:width .35s ease;
  }
  .cl-progress .count{
    font-family:'Cormorant Garamond',serif;
    font-weight:600;font-size:17px;color:var(--sea);
    min-width:54px;text-align:right;
  }
  .cl-group{margin-bottom:22px}
  .cl-group > h4{
    font-family:'Shippori Mincho',serif;
    font-weight:700;font-size:14px;
    color:var(--gold);letter-spacing:.06em;
    display:flex;align-items:center;gap:10px;
    margin-bottom:10px;
  }
  .cl-group > h4::after{content:"";flex:1;height:1px;background:var(--line)}
  .cl-item{
    display:flex;align-items:flex-start;gap:12px;
    padding:11px 14px;margin-bottom:6px;
    background:var(--paper-2);
    border-radius:3px;cursor:pointer;
    user-select:none;
    transition:background .15s,opacity .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .cl-item:hover{background:#e6dcc6}
  .cl-box{
    flex-shrink:0;width:20px;height:20px;margin-top:1px;
    border:2px solid var(--gold);border-radius:4px;
    position:relative;background:transparent;
    transition:background .15s,border-color .15s;
  }
  .cl-box::after{
    content:"";position:absolute;
    left:5px;top:1px;width:5px;height:10px;
    border:solid var(--paper);border-width:0 2px 2px 0;
    transform:rotate(45deg) scale(0);
    transition:transform .15s;
  }
  .cl-item .lbl{font-size:14px;color:var(--ink);line-height:1.5}
  .cl-item .lbl small{display:block;font-size:11.5px;color:var(--sea);margin-top:1px}
  .cl-item.checked .cl-box{background:var(--gold);border-color:var(--gold)}
  .cl-item.checked .cl-box::after{transform:rotate(45deg) scale(1)}
  .cl-item.checked .lbl{opacity:.5;text-decoration:line-through;text-decoration-color:var(--gold)}
  .cl-item.key{border-left:3px solid var(--sea)}
  .cl-reset{
    margin-top:8px;
    background:none;border:1px solid var(--line);
    color:var(--sea);font-family:'Zen Kaku Gothic New';
    font-size:12.5px;padding:8px 16px;border-radius:4px;
    cursor:pointer;transition:background .15s;
  }
  .cl-reset:hover{background:var(--paper-2)}

  /* ===== 経路ボタン ===== */
  .tt-btn{
    display:inline-flex;align-items:center;gap:5px;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:11.5px;font-weight:500;
    color:var(--ink);background:var(--gold-l);
    padding:6px 13px;border-radius:5px;
    text-decoration:none;margin-top:7px;
    transition:background .15s;
    -webkit-tap-highlight-color:transparent;
  }
  .tt-btn:hover{background:var(--gold)}

  /* ===== Googleマップリンク（TRIP側はデータのみ） ===== */
  .map-link{
    display:inline-flex;
    flex-direction:column;
    align-items:flex-start;
    gap:2px;
    margin-top:8px;
    padding:8px 11px;
    border:1px solid rgba(176,137,73,.42);
    border-radius:6px;
    color:var(--gold);
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    line-height:1.5;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s,border-color .15s,transform .15s;
  }
  .map-link:hover{
    background:rgba(176,137,73,.08);
    border-color:var(--gold);
  }
  .map-link:active{transform:scale(.99)}
  .map-link-sub{
    font-size:11.5px;
    font-weight:400;
    color:rgba(13,36,56,.68);
  }
  .evening .map-link{
    color:var(--gold-l);
    border-color:rgba(207,167,101,.45);
  }
  .evening .map-link:hover{background:rgba(207,167,101,.09)}
  .evening .map-link-sub{color:rgba(244,239,228,.72)}
  .map-link.is-invalid{
    pointer-events:none;
    opacity:.55;
    border-style:dashed;
  }

  @media(max-width:600px){
    section.checklist{padding:0 22px 24px}
    .map-link{display:flex;width:100%}
  }


  /* ===== 最終ページ：主要地点・Googleマップ一覧 ===== */
  section.map-directory{padding:4px 48px 30px}
  .map-directory-intro{
    margin:18px 0 14px;
    font-size:13px;
    color:rgba(13,36,56,.72);
  }
  .place-drawer{
    margin-bottom:11px;
    scroll-margin-top:12px;
    border:1px solid rgba(47,111,134,.28);
    border-radius:8px;
    background:rgba(255,255,255,.38);
    overflow:hidden;
    box-shadow:0 3px 12px rgba(13,36,56,.05);
  }
  .place-drawer summary{
    list-style:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 15px;
    font-family:'Shippori Mincho',serif;
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }
  .place-drawer summary::-webkit-details-marker{display:none}
  .place-drawer summary::after{
    content:"＋";
    flex-shrink:0;
    width:26px;height:26px;
    display:grid;place-items:center;
    border-radius:50%;
    background:var(--sea);
    color:#fff;
    font-family:'Zen Kaku Gothic New',sans-serif;
    font-size:17px;
    line-height:1;
    transition:transform .2s ease;
  }
  .place-drawer[open] summary{
    background:rgba(47,111,134,.08);
    border-bottom:1px solid rgba(47,111,134,.22);
  }
  .place-drawer[open] summary::after{
    content:"−";
    transform:rotate(180deg);
  }
  .place-list{padding:10px}
  .place-card{
    display:grid;
    grid-template-columns:34px 1fr auto;
    align-items:center;
    gap:11px;
    padding:12px 11px;
    margin-bottom:8px;
    border:1px solid rgba(176,137,73,.24);
    border-radius:7px;
    background:rgba(244,239,228,.82);
    color:var(--ink);
    text-decoration:none;
    -webkit-tap-highlight-color:transparent;

/* =====================================================================
   レンダラー（基本いじらない）
   ===================================================================== */
function coverHTML(c){
  var meta = c.meta.map(function(m){
    return '<div><span>'+m.label+'</span><strong>'+m.value+'</strong></div>';
  }).join('');
  return '<header class="cover"><div class="wave"></div>'
    + '<div class="eyebrow">'+c.eyebrow+'</div>'
    + '<h1>'+c.title+'</h1>'
    + '<div class="sub">'+c.sub+'</div>'
    + '<div class="meta">'+meta+'</div>'
    + '</header>';
}

function safeMapUrl(url){
  try{
    var u = new URL(url);
    var allowedHosts = ['www.google.com','google.com','maps.app.goo.gl'];
    var blockedText = /(googleusercontent\.com|placeholder|example\.com)/i;
    if(u.protocol !== 'https:' || allowedHosts.indexOf(u.hostname) === -1 || blockedText.test(url)){
      return '';
    }
    return u.href;
  }catch(e){
    return '';
  }
}

function mapLinkHTML(link){
  if(!link) return '';
  var href = safeMapUrl(link.url || '');
  var sub = link.sub ? '<span class="map-link-sub">'+link.sub+'</span>' : '';
  if(!href){
    return '<span class="map-link is-invalid">⚠ 地図リンクを確認してください'+sub+'</span>';
  }
  return '<a class="map-link" href="'+href+'" target="_blank" rel="noopener noreferrer">'
    + '<span>'+link.label+'</span>'+sub+'</a>';
}

function timelineHTML(b){
  var stops = b.stops.map(function(s){
    var cls   = 'stop' + (s.key ? ' key' : '');
    var sub   = s.sub   ? '<small>'+s.sub+'</small>' : '';
    var badge = s.badge ? ' <span class="badge">'+s.badge+'</span>' : '';
    var btnUrl = s.btn ? safeMapUrl(s.btn.url || '') : '';
    var btn   = (s.btn && btnUrl) ? '<a href="'+btnUrl+'" target="_blank" rel="noopener noreferrer" class="tt-btn">'+s.btn.label+'</a>' : '';
    var mapLink = mapLinkHTML(s.mapLink);
    var drawer = '';
    if(s.drawer){
      var drawerUrl = s.drawer.btn ? safeMapUrl(s.drawer.btn.url || '') : '';
      var dBtn = (s.drawer.btn && drawerUrl) ? '<a href="'+drawerUrl+'" target="_blank" rel="noopener noreferrer" class="tt-btn">'+s.drawer.btn.label+'</a>' : '';
      drawer = '<details class="transit-drawer"><summary>'+s.drawer.label+'</summary>'
        + '<div class="transit-body">'+(s.drawer.html || '')+dBtn+'</div></details>';
    }
    return '<div class="'+cls+'">'
      + '<div class="time">'+s.time+sub+'</div>'
      + '<h3>'+s.title+badge+'</h3>'
      + (s.html || '')
      + mapLink
      + btn
      + drawer
      + '</div>';
  }).join('');
  return '<div class="timeline">'+stops+'</div>';
}

function talkHTML(b){
  var grid = b.grid.map(function(g){
    return '<div'+(g.wide?' class="wide"':'')+'><span>'+g.label+'</span><strong>'+g.value+'</strong></div>';
  }).join('');
  return '<div class="talk"><div class="tag">'+b.tag+'</div><h3>'+b.title+'</h3><div class="grid">'+grid+'</div></div>';
}

function noteHTML(b){
  return '<div class="note"><span class="mk">'+b.mark+'</span><span>'+b.html+'</span></div>';
}

function eveningHTML(b){
  var rows = b.rows.map(function(r){
    return '<div class="row"><span class="t">'+r.t+'</span><span>'+r.html+mapLinkHTML(r.mapLink)+'</span></div>';
  }).join('');
  return '<div class="evening"><h4>'+b.title+'</h4>'+rows+'</div>';
}

function blockHTML(b){
  switch(b.type){
    case 'timeline': return timelineHTML(b);
    case 'talk':     return talkHTML(b);
    case 'note':     return noteHTML(b);
    case 'evening':  return eveningHTML(b);
    default:         return '';
  }
}

function dayHTML(d){
  var head = '<div class="day-head"><div class="num">'+d.num+'</div>'
    + '<div class="dh-txt"><h2>'+d.date+'</h2><p>'+d.route+'</p></div></div>';
  var body = '<section class="day">'+ d.blocks.map(blockHTML).join('') +'</section>';
  return '<div class="day-chapter day-'+d.num+'">' + head + body + '</div>';
}

function mapDirectoryHTML(md){
  if(!md || !md.groups) return '';
  var groups = md.groups.map(function(g){
    var items = g.items.map(function(it){
      var href = safeMapUrl(it.url || '');
      var cls = 'place-card' + (it.route ? ' route' : '');
      var icon = it.icon || '📍';
      var content = '<span class="place-icon">'+icon+'</span>'
        + '<span><span class="place-name">'+it.name+'</span>'
        + '<span class="place-address">'+it.address+'</span></span>'
        + '<span class="place-action">›</span>';
      if(!href){
        return '<span class="'+cls+' is-invalid">'+content+'</span>';
      }
      return '<a class="'+cls+'" href="'+href+'" target="_blank" rel="noopener noreferrer">'+content+'</a>';
    }).join('');
    return '<details class="place-drawer"><summary>'+g.title+'</summary><div class="place-list">'+items+'</div></details>';
  }).join('');
  var note = md.note ? '<div class="map-directory-note">'+md.note+'</div>' : '';
  return '<div class="day-head"><div class="num">⌖</div>'
    + '<div class="dh-txt"><h2>'+md.title+'</h2><p>住所・徒歩ルートをすぐ開く</p></div></div>'
    + '<section class="map-directory"><p class="map-directory-intro">'+md.intro+'</p>'+groups+note+'</section>';
}

function checklistHTML(cl){
  var groups = cl.groups.map(function(g){
    var items = g.items.map(function(it){
      var cls = 'cl-item' + (it.key ? ' key' : '');
      var sub = it.sub ? '<small>'+it.sub+'</small>' : '';
      return '<div class="'+cls+'"><div class="cl-box"></div><div class="lbl">'+it.label+sub+'</div></div>';
    }).join('');
    return '<div class="cl-group"><h4>'+g.title+'</h4>'+items+'</div>';
  }).join('');
  return '<div class="day-head"><div class="num">✓</div>'
    + '<div class="dh-txt"><h2>持ち物チェックリスト</h2><p>'+cl.intro+'</p></div></div>'
    + '<section class="checklist">'
    + '<div class="cl-progress"><div class="bar"><i id="clBar"></i></div><div class="count" id="clCount">0/0</div></div>'
    + groups
    + '<button class="cl-reset" id="clReset">すべてのチェックを外す</button>'
    + '</section>';
}

/* 描画 */
document.getElementById('book').innerHTML =
    coverHTML(TRIP.cover)
  + TRIP.days.map(dayHTML).join('')
  + checklistHTML(TRIP.checklist)
  + mapDirectoryHTML(TRIP.mapDirectory)
  + '<div class="foot">'+TRIP.foot+'</div>';

/* 乗換・主要地点ドロワー：開いた内容が画面外に隠れる場合だけ先頭へ寄せる */
(function(){
  var drawers = Array.prototype.slice.call(document.querySelectorAll('.transit-drawer, .place-drawer'));
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  drawers.forEach(function(drawer){
    drawer.addEventListener('toggle', function(){
      if(!drawer.open) return;
      window.requestAnimationFrame(function(){
        var rect = drawer.getBoundingClientRect();
        var needsScroll = rect.top < 8 || rect.bottom > window.innerHeight - 8;
        if(needsScroll){
          drawer.scrollIntoView({
            behavior: reduceMotion ? 'auto' : 'smooth',
            block: 'start'
          });
        }
      });
    });
  });
})();

/* チェックリストの保存・進捗（localStorage） */
(function(){
  var items = Array.prototype.slice.call(document.querySelectorAll('.cl-item'));
  var bar   = document.getElementById('clBar');
  var count = document.getElementById('clCount');
  var KEY   = TRIP.checklist.key;

  items.forEach(function(el, i){
    el.dataset.k = (el.querySelector('.lbl').textContent.trim().slice(0,24)) + '_' + i;
  });

  function load(){
    try{
      var saved = JSON.parse(localStorage.getItem(KEY) || '{}');
      items.forEach(function(el){ if(saved[el.dataset.k]) el.classList.add('checked'); });
    }catch(e){}
  }
  function save(){
    try{
      var o = {};
      items.forEach(function(el){ if(el.classList.contains('checked')) o[el.dataset.k]=1; });
      localStorage.setItem(KEY, JSON.stringify(o));
    }catch(e){}
  }
  function update(){
    var done = items.filter(function(el){return el.classList.contains('checked');}).length;
    count.textContent = done + '/' + items.length;
    bar.style.width = (items.length ? (done/items.length*100) : 0) + '%';
  }

  items.forEach(function(el){
    el.addEventListener('click', function(){ el.classList.toggle('checked'); save(); update(); });
  });
  document.getElementById('clReset').addEventListener('click', function(){
    items.forEach(function(el){ el.classList.remove('checked'); });
    save(); update();
  });

  load(); update();
})();
</script>
