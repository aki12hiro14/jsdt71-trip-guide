<script>
(function(){'use strict';
  const form=document.getElementById('unlock'); const pw=document.getElementById('pass');const go=document.getElementById('go');const status=document.getElementById('status');
  const data=JSON.parse(document.getElementById('payload').textContent);
  function b64(s){const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}
  async function unlock(password){
    if(!crypto||!crypto.subtle)throw new Error('このブラウザでは復号できません。HTTPSのGitHub Pagesから開いてください。');
    const enc=new TextEncoder();const base=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(data.salt),iterations:data.iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    const clear=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(data.iv)},key,b64(data.ciphertext));
    const text=new TextDecoder('utf-8').decode(clear);
    if(!text.startsWith('<!doctype html>'))throw new Error('旅程を読み取れませんでした');
    document.open();document.write(text);document.close();
  }
  form.addEventListener('submit',async function(e){e.preventDefault();status.textContent='';go.disabled=true;go.textContent='開いています…';
    try{await unlock(pw.value);}catch(err){status.textContent=(String(err).includes('このブラウザ')?err.message:'パスワードが違うか、読み込みに失敗しました。');go.disabled=false;go.textContent='しおりを開く';pw.select();}
  });
})();
</script></body></html>
